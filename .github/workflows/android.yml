name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project if needed
        run: |
          if [ -f "project.zip" ]; then
            unzip -o project.zip
          fi

      - name: Auto-Fix Compile SDK & Compose Version
        run: |
          python3 -c "
          import glob, re, os

          # 1. Ayusin ang Compose version sa 1.5.10
          files = glob.glob('**/app/build.gradle.kts', recursive=True) + glob.glob('**/app/build.gradle', recursive=True)
          for f_path in files:
              print(f'Fixing Compose version in: {f_path}')
              with open(f_path, 'r') as f:
                  content = f.read()
              fixed = re.sub(r'kotlinCompilerExtensionVersion\s*=\s*[\"\'\"][^\"\'\"]+[\"\'\"]', 'kotlinCompilerExtensionVersion = \"1.5.10\"', content)
              with open(f_path, 'w') as f:
                  f.write(fixed)

          # 2. Idagdag ang suppress warning sa gradle.properties
          prop_files = glob.glob('**/gradle.properties', recursive=True)
          if prop_files:
              for p_path in prop_files:
                  print(f'Updating properties in: {p_path}')
                  with open(p_path, 'a') as f:
                      f.write('\nandroid.suppressUnsupportedCompileSdk=35\n')
          else:
              # Pag walang gradle.properties, gagawa tayo
              print('Creating gradle.properties')
              with open('gradle.properties', 'w') as f:
                  f.write('android.suppressUnsupportedCompileSdk=35\n')
          "

      - name: Auto-Detect Project Directory
        run: |
          GRADLE_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
          echo "PROJECT_DIR=$GRADLE_DIR" >> $GITHUB_ENV
          echo "Found gradlew in: $GRADLE_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyTapPH-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
