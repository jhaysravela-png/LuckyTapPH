name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install unzip and gradle
        run: sudo apt-get update && sudo apt-get install -y unzip gradle

      - name: Extract project
        run: unzip -q project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Gradle Wrapper 8.7
        # Kung iba ang folder name sa loob ng zip, palitan ito
        working-directory: ./LuckyTapPH
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK (Suppress Compatibility Check)
        working-directory: ./LuckyTapPH
        run: |
          chmod +x gradlew
          # Pwersahang balewalain ang Kotlin/Compose version check
          ./gradlew assembleDebug -Pandroid.experimental.suppressKotlinVersionCompatibilityCheck=true --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyTapPH-debug
          path: LuckyTapPH/app/build/outputs/apk/debug/*.apk
