name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Complete Android Project Structure
        run: |
          python3 -c "
          import os, shutil, glob, re

          # 1. Create standard Android directory tree
          os.makedirs('app/src/main/java/com/LuckyTapPH/ph', exist_ok=True)
          os.makedirs('app/src/main/res/layout', exist_ok=True)

          # 2. Setup settings.gradle.kts with Plugin Repositories
          settings_content = '''
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = \"LuckyTapPH\"
          include(\":app\")
          '''
          with open('settings.gradle.kts', 'w') as f:
              f.write(settings_content)

          # 3. Setup Root build.gradle.kts
          root_build = '''
          plugins {
              id(\"com.android.application\") version \"8.5.2\" apply false
              id(\"org.jetbrains.kotlin.android\") version \"1.9.22\" apply false
          }
          '''
          with open('build.gradle.kts', 'w') as f:
              f.write(root_build)

          # 4. Setup app/build.gradle.kts
          app_build = '''
          plugins {
              id(\"com.android.application\")
              id(\"org.jetbrains.kotlin.android\")
          }

          android {
              namespace = \"com.LuckyTapPH.ph\"
              compileSdk = 34

              defaultConfig {
                  applicationId = \"com.LuckyTapPH.ph\"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = \"1.0\"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = \"17\"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = \"1.5.10\"
              }
          }

          dependencies {
              implementation(\"androidx.core:core-ktx:1.12.0\")
              implementation(\"androidx.lifecycle:lifecycle-runtime-ktx:2.7.0\")
              implementation(\"androidx.activity:activity-compose:1.8.2\")
              implementation(platform(\"androidx.compose:compose-bom:2023.08.00\"))
              implementation(\"androidx.compose.ui:ui\")
              implementation(\"androidx.compose.ui:ui-graphics\")
              implementation(\"androidx.compose.ui:ui-tooling-preview\")
              implementation(\"androidx.compose.material3:material3\")
          }
          '''
          with open('app/build.gradle.kts', 'w') as f:
              f.write(app_build)

          # 5. Move code files to proper places
          if os.path.exists('AndroidManifest.xml'):
              shutil.move('AndroidManifest.xml', 'app/src/main/AndroidManifest.xml')

          if os.path.exists('MainActivity.kt'):
              shutil.move('MainActivity.kt', 'app/src/main/java/com/LuckyTapPH/ph/MainActivity.kt')

          if os.path.exists('activity_main.xml'):
              shutil.move('activity_main.xml', 'app/src/main/res/layout/activity_main.xml')

          # 6. Patch MainActivity.kt for tapsVal missing declaration
          kt_files = glob.glob('**/MainActivity.kt', recursive=True)
          for kt in kt_files:
              with open(kt, 'r') as f:
                  code = f.read()
              if 'tapsVal' in code and 'val tapsVal' not in code and 'var tapsVal' not in code:
                  code = re.sub(r'(class MainActivity[^{]*\{)', r'\1\n    var tapsVal: Int = 0', code)
              with open(kt, 'w') as f:
                  f.write(code)

          # 7. Configure gradle.properties
          with open('gradle.properties', 'w') as f:
              f.write('android.useAndroidX=true\nandroid.suppressUnsupportedCompileSdk=35\n')

          print('Project fully restructured and configured!')
          "

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate Wrapper & Build APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyTapPH-APK
          path: "app/build/outputs/apk/debug/*.apk"
