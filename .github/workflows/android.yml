name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install unzip and gradle
        run: sudo apt-get update && sudo apt-get install -y unzip gradle python3

      - name: Extract project
        run: unzip -q LuckyTapPH.zip

      - name: Replace KAPT line cleanly
        run: |
          python3 -c "
          path = 'LuckyTapPH/app/build.gradle.kts'
          with open(path, 'r') as f:
              lines = f.readlines()
          
          new_lines = []
          for line in lines:
              if 'kotlin.kapt' in line:
                  new_lines.append('    id(\"org.jetbrains.kotlin.kapt\")\n')
              elif 'kotlin.android' in line:
                  new_lines.append('    id(\"org.jetbrains.kotlin.android\")\n')
              elif 'android.application' in line:
                  new_lines.append('    id(\"com.android.application\")\n')
              else:
                  new_lines.append(line)
          
          with open(path, 'w') as f:
              f.writelines(new_lines)
          "

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Gradle Wrapper 8.7
        working-directory: ./LuckyTapPH
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        working-directory: ./LuckyTapPH
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyTapPH-debug
          path: LuckyTapPH/app/build/outputs/apk/debug/*.apk
