name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install unzip and gradle
        run: sudo apt-get update && sudo apt-get install -y unzip gradle python3

      - name: Extract project
        run: unzip -q LuckyTapPH.zip

      - name: Clean ALL plugin versions in App gradle
        run: |
          python3 -c "
          path = 'LuckyTapPH/app/build.gradle.kts'
          with open(path, 'r') as f:
              lines = f.readlines()
          
          import re
          new_lines = []
          for line in lines:
              # Pag ang linya ay id(...) version '...', tatanggalin ang version part
              if 'id(' in line and 'version' in line:
                  cleaned_line = re.sub(r'\s+version\s+[\"\'][^\"\']+[\"\']', '', line)
                  new_lines.append(cleaned_line)
              else:
                  new_lines.append(line)
          
          with open(path, 'w') as f:
              f.writelines(new_lines)
          "

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Gradle Wrapper 8.7
        working-directory: ./LuckyTapPH
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        working-directory: ./LuckyTapPH
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyTapPH-debug
          path: LuckyTapPH/app/build/outputs/apk/debug/*.apk
