name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install unzip and gradle
        run: sudo apt-get update && sudo apt-get install -y unzip gradle python3

      - name: Extract project
        run: unzip -q LuckyTapPH.zip

      - name: Force Fix Plugins Block in App
        run: |
          python3 -c "
          path = 'LuckyTapPH/app/build.gradle.kts'
          with open(path, 'r') as f:
              lines = f.readlines()
          
          # Tanggalin ang buong plugins block para walang conflict
          new_lines = []
          in_plugins = False
          for line in lines:
              if 'plugins {' in line:
                  in_plugins = True
                  continue
              if in_plugins and '}' in line:
                  in_plugins = False
                  continue
              if not in_plugins:
                  new_lines.append(line)
          
          # Idagdag ang apply plugin sa pinakataas
          header = 'apply(plugin = \"com.android.application\")\napply(plugin = \"org.jetbrains.kotlin.android\")\napply(plugin = \"org.jetbrains.kotlin.kapt\")\n\n'
          
          with open(path, 'w') as f:
              f.write(header + ''.join(new_lines))
          "

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Gradle Wrapper 8.7
        working-directory: ./LuckyTapPH
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        working-directory: ./LuckyTapPH
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyTapPH-debug
          path: LuckyTapPH/app/build/outputs/apk/debug/*.apk
