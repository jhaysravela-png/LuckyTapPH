name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install unzip, gradle, python3
        run: sudo apt-get update && sudo apt-get install -y unzip gradle python3

      - name: Extract project
        run: unzip -q LuckyTapPH_Fixed_v2.zip

      - name: Clean project structure and Strip Plugin Versions
        run: |
          # 1. Burahin ang mga duplicate (_1) files
          find . -name "*_1*" -delete

          # 2. Hahanapin ang app/build.gradle.kts at tatanggalin ang LAHAT ng plugin versions doon
          python3 -c "
          import glob, re

          # Hanapin ang app/build.gradle.kts
          files = glob.glob('**/app/build.gradle.kts', recursive=True)
          for file_path in files:
              print(f'Cleaning versions in: {file_path}')
              with open(file_path, 'r') as f:
                  content = f.read()

              # Tatanggalin ang 'version \"...\"' o 'version(\"...\")' o 'version '\''...'\'''
              cleaned = re.sub(r'version\s*[\(\'\"][^\)\'\"]+[\)\'\"]', '', content)

              with open(file_path, 'w') as f:
                  f.write(cleaned)
          "

          # 3. Kuhanin ang project path
          GRADLE_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
          echo "PROJECT_DIR=$GRADLE_DIR" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Gradle Wrapper 8.7
        run: |
          cd ${{ env.PROJECT_DIR }}
          gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyTapPH-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
