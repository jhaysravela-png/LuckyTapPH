name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project if uploaded as zip
        run: |
          if [ -f "project.zip" ]; then
            unzip -o project.zip
            rm project.zip
            # if extracted creates LuckyTapPH folder, move contents to root
            if [ -d "LuckyTapPH" ]; then
              mv LuckyTapPH/*. 2>/dev/null || true
              mv LuckyTapPH/.*. 2>/dev/null || true
            fi
          fi
          ls -R | head -100

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build APK
        run: |
          chmod +x gradlew
         ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyTapPH-APK
          path: app/build/outputs/apk/debug/*.apk
