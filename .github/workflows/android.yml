name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix project structure
        run: |
          mkdir -p app/src/main/java/com/jayson/cointap
          mkdir -p app/src/main/res/layout
          mkdir -p gradle/wrapper
          # Move files to correct place
          mv AndroidManifest.xml app/src/main/ || true
          mv MainActivity.kt app/src/main/java/com/jayson/cointap/ || true
          mv activity_main.xml app/src/main/res/layout/ || true
          # Handle both names
          if [ -f "build.gradle.kts" ]; then
            # Check if it's app or root build file
            if grep -q "application" build.gradle.kts; then
              mv build.gradle.kts app/ || true
            fi
          fi
          mv gradle-wrapper.properties gradle/wrapper/ || true
          mv gradlew . || true
          mv gradlew.bat . || true
          # Create missing files if needed
          echo 'include(":app")' > settings.gradle.kts
          cat > build.gradle.kts << 'EOF'
          plugins { id("com.android.application") version "8.2.2" apply false
           id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          EOF
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.suppressUnsupportedCompileSdk=35
          EOF
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          # Fix MainActivity package path if needed
          ls -R
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoinTap-APK
          path: app/build/outputs/apk/debug/*.apk
