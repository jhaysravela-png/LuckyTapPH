name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip if needed
        run: |
          ls -la
          ZIP=$(ls -1 project*.zip 2>/dev/null | head -1)
          if [ -n "$ZIP" ]; then
            echo "Found $ZIP, unzipping..."
            unzip -o "$ZIP"
            rm "$ZIP"
          fi
          ls -la
          ls -la app/ || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build APK
        run: |
          chmod +x gradlew
         ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyTapPH-APK
          path: app/build/outputs/apk/debug/*.apk
