name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Complete Android Project (com.jayson.cointap)
        run: |
          python3 -c "
          import os, shutil

          # 1. Create correct package directories for com.jayson.cointap
          pkg_dir = 'app/src/main/java/com/jayson/cointap'
          os.makedirs(pkg_dir, exist_ok=True)
          os.makedirs('app/src/main/res/layout', exist_ok=True)

          # 2. Setup settings.gradle.kts
          settings_content = '''
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = \"CoinTap\"
          include(\":app\")
          '''
          with open('settings.gradle.kts', 'w') as f:
              f.write(settings_content)

          # 3. Setup Root build.gradle.kts
          root_build = '''
          plugins {
              id(\"com.android.application\") version \"8.5.2\" apply false
              id(\"org.jetbrains.kotlin.android\") version \"1.9.22\" apply false
          }
          '''
          with open('build.gradle.kts', 'w') as f:
              f.write(root_build)

          # 4. Setup app/build.gradle.kts for Classic AppCompat
          app_build = '''
          plugins {
              id(\"com.android.application\")
              id(\"org.jetbrains.kotlin.android\")
          }

          android {
              namespace = \"com.jayson.cointap\"
              compileSdk = 34

              defaultConfig {
                  applicationId = \"com.jayson.cointap\"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = \"1.0\"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = \"17\"
              }
          }

          dependencies {
              implementation(\"androidx.core:core-ktx:1.12.0\")
              implementation(\"androidx.appcompat:appcompat:1.6.1\")
              implementation(\"com.google.android.material:material:1.11.0\")
              implementation(\"androidx.constraintlayout:constraintlayout:2.1.4\")
          }
          '''
          with open('app/build.gradle.kts', 'w') as f:
              f.write(app_build)

          # 5. Move code and XML layout files
          if os.path.exists('AndroidManifest.xml'):
              shutil.move('AndroidManifest.xml', 'app/src/main/AndroidManifest.xml')

          if os.path.exists('MainActivity.kt'):
              shutil.move('MainActivity.kt', f'{pkg_dir}/MainActivity.kt')

          if os.path.exists('activity_main.xml'):
              shutil.move('activity_main.xml', 'app/src/main/res/layout/activity_main.xml')

          # 6. Configure gradle.properties
          with open('gradle.properties', 'w') as f:
              f.write('android.useAndroidX=true\nandroid.suppressUnsupportedCompileSdk=35\n')

          print('CoinTap successfully configured for com.jayson.cointap!')
          "

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate Wrapper & Build APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoinTap-APK
          path: "app/build/outputs/apk/debug/*.apk"
