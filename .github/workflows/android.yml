name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move MainActivity if in root
        run: |
          mkdir -p app/src/main/java/com/jayson/cointap
          if [ -f "MainActivity.kt" ]; then
            mv MainActivity.kt app/src/main/java/com/jayson/cointap/MainActivity.kt
          fi

      - name: Setup Gradle Files
        run: |
          python3 -c "
          import os
          with open('settings.gradle.kts', 'w') as f:
              f.write('rootProject.name = \"CoinTap\"\ninclude(\":app\")\n')
          
          with open('build.gradle.kts', 'w') as f:
              f.write('plugins { id(\"com.android.application\") version \"8.5.2\" apply false; id(\"org.jetbrains.kotlin.android\") version \"1.9.22\" apply false }\n')

          with open('app/build.gradle.kts', 'w') as f:
              f.write('''plugins {
              id(\"com.android.application\")
              id(\"org.jetbrains.kotlin.android\")
          }
          android {
              namespace = \"com.jayson.cointap\"
              compileSdk = 34
              defaultConfig {
                  applicationId = \"com.jayson.cointap\"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = \"1.0\"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = \"17\" }
          }
          dependencies {
              implementation(\"androidx.core:core-ktx:1.12.0\")
              implementation(\"androidx.appcompat:appcompat:1.6.1\")
              implementation(\"com.google.android.material:material:1.11.0\")
              implementation(\"androidx.constraintlayout:constraintlayout:2.1.4\")
          }''')

          with open('gradle.properties', 'w') as f:
              f.write('android.useAndroidX=true\nandroid.suppressUnsupportedCompileSdk=35\n')
          "

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate Wrapper & Build APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoinTap-APK
          path: "app/build/outputs/apk/debug/*.apk"
