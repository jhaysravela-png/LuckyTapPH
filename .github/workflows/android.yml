name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: REBUILD ENTIRE PROJECT FROM SCRATCH
        run: |
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties gradlew gradlew.bat gradle
          mkdir -p app/src/main/java/com/jayson/cointap
          mkdir -p app/src/main/res/layout
          mkdir -p gradle/wrapper

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.suppressUnsupportedCompileSdk=35
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.jayson.cointap"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.jayson.cointap"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("androidx.core:core-ktx:1.12.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:allowBackup="true" android:label="CoinTap" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/jayson/cointap/MainActivity.kt << 'EOF'
          package com.jayson.cointap
          import android.os.Bundle
          import android.os.CountDownTimer
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              var coins = 0
              var timeLeft = 30
              var playing = false
              lateinit var timer: CountDownTimer
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  val tapBtn = findViewById<Button>(R.id.tapBtn)
                  val scoreTxt = findViewById<TextView>(R.id.scoreTxt)
                  val timeTxt = findViewById<TextView>(R.id.timeTxt)
                  val msgTxt = findViewById<TextView>(R.id.msgTxt)
                  tapBtn.setOnClickListener {
                      if (!playing) {
                          playing = true
                          coins = 0
                          timeLeft = 30
                          timer = object: CountDownTimer(30000, 1000) {
                              override fun onTick(m: Long) { timeLeft--; timeTxt.text = "Time: $timeLeft" }
                              override fun onFinish() { playing = false; msgTxt.text = "Game Over! Coins: $coins"; timeTxt.text = "Time: 0" }
                          }.start()
                      }
                      if (playing) { coins++; scoreTxt.text = "Coins: $coins" }
                  }
              }
          }
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:orientation="vertical" android:gravity="center"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="#FFF9C4" android:padding="20dp">
              <TextView android:id="@+id/timeTxt" android:text="Time: 30" android:textSize="24sp" android:textStyle="bold" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
              <TextView android:id="@+id/scoreTxt" android:text="Coins: 0" android:textSize="28sp" android:textStyle="bold" android:layout_marginTop="10dp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
              <TextView android:id="@+id/msgTxt" android:text="Tap to Start!" android:textSize="18sp" android:layout_marginTop="10dp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
              <Button android:id="@+id/tapBtn" android:text="TAP COIN!" android:textSize="30sp" android:layout_width="300dp" android:layout_height="300dp" android:layout_marginTop="40dp" android:backgroundTint="#FFD700"/>
          </LinearLayout>
          EOF

          ls -R

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-art
