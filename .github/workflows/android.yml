name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install unzip and gradle
        run: sudo apt-get update && sudo apt-get install -y unzip gradle

      - name: Extract project
        run: unzip -q LuckyTapPH_Fixed_v2.zip

      - name: Clean duplicates and auto-detect directory
        run: |
          # 1. Burahin ang mga duplicate (_1) files
          find . -name "*_1*" -delete

          # 2. Kusang hahanapin kung saang folder naroon ang gradlew
          GRADLE_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
          echo "PROJECT_DIR=$GRADLE_DIR" >> $GITHUB_ENV
          echo "Nahanap ang project sa folder na: $GRADLE_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Gradle Wrapper 8.7
        run: |
          cd ${{ env.PROJECT_DIR }}
          gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyTapPH-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
